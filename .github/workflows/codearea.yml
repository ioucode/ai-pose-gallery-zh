# codearea 构建(fork 自加):CI 只构建,产物打成镜像推 GHCR(ghcr.io/ioucode/ai-pose-gallery-zh),
# 部署由 ioucode/cf-workers 的 pose-gallery/deploy.sh 在本机执行(拉镜像 → wrangler 上传静态资源 + Worker)。
# 镜像内容:/dist(静态站点,含 img/thumbs/data)、/worker/worker.js(打包好的 Worker 入口)。
name: codearea

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 构建站点
        run: |
          pnpm install --frozen-lockfile
          bash scripts/build.sh
          test "$(find dist -type f | wc -l)" -lt 20000   # Workers 静态资源免费版上限
      - name: 打包 Worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir worker-out
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 产物推 GHCR
        run: |
          set -euo pipefail
          mkdir -p ctx/worker && mv dist ctx/dist && cp worker-out/worker.js ctx/worker/
          printf 'FROM scratch\nCOPY dist /dist\nCOPY worker /worker\n' > ctx/Dockerfile
          docker buildx build --platform linux/arm64 --provenance=false --push \
            -t ghcr.io/ioucode/ai-pose-gallery-zh:${GITHUB_SHA} -t ghcr.io/ioucode/ai-pose-gallery-zh:latest ctx
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
